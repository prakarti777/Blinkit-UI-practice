    <title>Product</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color:white;
            font-family: Arial, sans-serif;
        }

        .main {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 97px;
    background-color: white;
    padding: 0px 40px;
     border: 1px solid #e5e5e5;
}

          .logo img{
        display: block;
    width: 100px;
    height: 80px;
    }
      .logo{

        font-size: 28px;
        font-weight: bold;
    }
    .logo span{
        color:white;
    }

        .location h3 {
            font-size: 17px;
        }

        .location p {
            font-size: 13px;
            margin-top: 5px;
        }

        .search {
            flex: 1;
            max-width: 500px;
        }

        .search input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .login button,
        .cart button {
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

     

        .cart button {
            background-color:#ddd;
            color: white;
        }

        .products {
            margin-top: 50px;
            padding: 30px 40px;
            padding-bottom: 0%;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-heading h1 {
            font-size: 28px;
        }

        .section-heading a {
            text-decoration: none;
            color: green;
            font-weight: bold;
        }

      .products-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    column-gap: 15px;
    row-gap: 10px;
}

       .product-card {
    height: 380px;
    width: 100%;
    background-color: white;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 5px;
    overflow: hidden;
    cursor: pointer;
}

        .product-image {
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-card h3 {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .product-card p {
            font-size: 15px;
            font-weight: bold;
        }

        .product-card button {
            margin-top: 12px;
            padding: 9px 18px;
            background-color: white;
            color: green;
            border: 1px solid green;
            border-radius: 6px;
            cursor: pointer;
        }

        .product-card button:hover {
            background-color: green;
            color: white;
        }
    </style>
</head>
